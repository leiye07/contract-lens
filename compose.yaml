name: contractlens
x-runtime: &runtime
  build: .
  image: contractlens:1.0
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  environment: &environment
    DATABASE_URL: postgresql://contractlens:contractlens-local-only@postgres:5432/contractlens
    MODEL_EXECUTION_ENABLED: ${MODEL_EXECUTION_ENABLED:-false}
    CONTRACTLENS_MODEL: ${CONTRACTLENS_MODEL:-}
    CONTRACTLENS_BUDGET_MODEL_CALLS: ${CONTRACTLENS_BUDGET_MODEL_CALLS:-24}
    CONTRACTLENS_BUDGET_TOOL_CALLS: ${CONTRACTLENS_BUDGET_TOOL_CALLS:-40}
    CONTRACTLENS_BUDGET_TIMEOUT_SECONDS: ${CONTRACTLENS_BUDGET_TIMEOUT_SECONDS:-300}
    CONTRACTLENS_BUDGET_CONTEXT_BYTES: ${CONTRACTLENS_BUDGET_CONTEXT_BYTES:-160000}
    CONTRACTLENS_BUDGET_OUTPUT_TOKENS: ${CONTRACTLENS_BUDGET_OUTPUT_TOKENS:-4096}
    CONTRACTLENS_BUDGET_REQUEST_TIMEOUT_SECONDS: ${CONTRACTLENS_BUDGET_REQUEST_TIMEOUT_SECONDS:-30}
    CONTRACTLENS_BUDGET_RESPONSE_BYTES: ${CONTRACTLENS_BUDGET_RESPONSE_BYTES:-128000}
    CONTRACTLENS_BUDGET_TOOL_INPUT_BYTES: ${CONTRACTLENS_BUDGET_TOOL_INPUT_BYTES:-16000}
    CONTRACTLENS_BUDGET_EVIDENCE_EVENTS: ${CONTRACTLENS_BUDGET_EVIDENCE_EVENTS:-320}
    CONTRACTLENS_BUDGET_EVIDENCE_PAYLOAD_BYTES: ${CONTRACTLENS_BUDGET_EVIDENCE_PAYLOAD_BYTES:-24000}
    CONTRACTLENS_BUDGET_PLAN_REVISIONS: ${CONTRACTLENS_BUDGET_PLAN_REVISIONS:-8}
    CONTRACTLENS_BUDGET_LEDGER_ENTRIES: ${CONTRACTLENS_BUDGET_LEDGER_ENTRIES:-24}
    CONTRACTLENS_BUDGET_TOOLS_PER_TURN: ${CONTRACTLENS_BUDGET_TOOLS_PER_TURN:-6}
    DEMO_TOKEN_FILE: /run/secrets/demo_token
  secrets: [demo_token]
  networks: [internal]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  mem_limit: 512m
  cpus: 1
  stop_grace_period: 10s
  depends_on:
    postgres: {condition: service_healthy}
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: contractlens
      POSTGRES_DB: contractlens
      POSTGRES_PASSWORD: contractlens-local-only
    volumes: [contractlens-data:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U contractlens -d contractlens]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    <<: *runtime
    ports: ['127.0.0.1:8020:8020']
    networks: [internal, integration]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8020/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *runtime
    command: [python, -m, contractlens.worker]
    environment:
      <<: *environment
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [demo_token, anthropic_api_key]
    networks: [internal, provider-egress]
    healthcheck:
      test: [CMD, python, -c, "from contractlens.db import connect; c=connect(); db=c.__enter__(); assert db.execute(\"SELECT 1 FROM runtime_health WHERE id='worker' AND last_seen>now()-interval '15 seconds'\").fetchone()"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  contractlens-data: {}
networks:
  internal:
    internal: true
  integration: {}
  provider-egress: {}
secrets:
  demo_token:
    file: ./secrets/demo_token
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
